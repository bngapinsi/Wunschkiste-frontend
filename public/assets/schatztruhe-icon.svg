<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Glanz-Strahlen hinter der Truhe -->
  <g opacity="0.5">
    <line x1="100" y1="15" x2="100" y2="40" stroke="#d4a94a" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="30" x2="72" y2="47" stroke="#d4a94a" stroke-width="3" stroke-linecap="round"/>
    <line x1="142" y1="30" x2="128" y2="47" stroke="#d4a94a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Geöffneter Deckel (hinten) -->
  <g>
    <path d="M 42 108 C 42 68 158 68 158 108 L 158 118 L 42 118 Z" fill="#a9682f" stroke="#6b3f1d" stroke-width="3"/>
    <path d="M 42 108 C 42 68 158 68 158 108" fill="none" stroke="#6b3f1d" stroke-width="3"/>
    <!-- Deckel-Beschlag -->
    <path d="M 88 72 C 88 68 112 68 112 72 L 112 92 C 112 96 88 96 88 92 Z" fill="#e8c766" stroke="#8a6a1f" stroke-width="2"/>
    <!-- Nieten auf dem Deckel -->
    <circle cx="55" cy="102" r="3" fill="#e8c766" stroke="#8a6a1f" stroke-width="1"/>
    <circle cx="75" cy="90" r="3" fill="#e8c766" stroke="#8a6a1f" stroke-width="1"/>
    <circle cx="125" cy="90" r="3" fill="#e8c766" stroke="#8a6a1f" stroke-width="1"/>
    <circle cx="145" cy="102" r="3" fill="#e8c766" stroke="#8a6a1f" stroke-width="1"/>
  </g>

  <!-- Wünsche, die aus der Truhe schweben/schauen -->
  <g>
    <!-- gerollter Wunschzettel -->
    <g transform="rotate(-8 68 100)">
      <rect x="58" y="82" width="20" height="30" rx="3" fill="#fdf6e3" stroke="#c9a24a" stroke-width="2"/>
      <line x1="63" y1="90" x2="73" y2="90" stroke="#c9a24a" stroke-width="1.5"/>
      <line x1="63" y1="96" x2="73" y2="96" stroke="#c9a24a" stroke-width="1.5"/>
      <line x1="63" y1="102" x2="70" y2="102" stroke="#c9a24a" stroke-width="1.5"/>
    </g>

    <!-- Herz -->
    <path d="M 100 100 C 100 92 90 89 90 97 C 90 103 100 111 100 111 C 100 111 110 103 110 97 C 110 89 100 92 100 100 Z"
          fill="#e0607a" stroke="#a6425c" stroke-width="2"/>

    <!-- Stern -->
    <path d="M 130 84 l 3.5 8 8.5 1 -6.2 6 1.5 8.5 -7.3 -4 -7.3 4 1.5 -8.5 -6.2 -6 8.5 -1 z"
          fill="#f5d67e" stroke="#c99a2e" stroke-width="2"/>
  </g>

  <!-- kleine Funken über den Wünschen -->
  <g fill="#f5d67e">
    <path d="M 70 68 l 2 4.5 4.5 2 -4.5 2 -2 4.5 -2 -4.5 -4.5 -2 4.5 -2 z" opacity="0.85"/>
    <path d="M 130 64 l 1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 z" opacity="0.75"/>
    <path d="M 100 56 l 1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" opacity="0.7"/>
  </g>

  <!-- Truhen-Korpus (vorne, unten) -->
  <g>
    <rect x="35" y="118" width="130" height="55" rx="6" fill="#8b5a2b" stroke="#5c3a1a" stroke-width="3"/>
    <!-- Holzmaserung / Bretter -->
    <line x1="35" y1="140" x2="165" y2="140" stroke="#5c3a1a" stroke-width="1.5" opacity="0.5"/>
    <line x1="35" y1="158" x2="165" y2="158" stroke="#5c3a1a" stroke-width="1.5" opacity="0.5"/>
    <!-- Goldene Bänder -->
    <rect x="35" y="118" width="130" height="12" fill="#e8c766" stroke="#8a6a1f" stroke-width="2"/>
    <rect x="35" y="160" width="130" height="12" fill="#e8c766" stroke="#8a6a1f" stroke-width="2"/>
    <!-- Vorderes Schloss -->
    <rect x="90" y="128" width="20" height="24" rx="4" fill="#e8c766" stroke="#8a6a1f" stroke-width="2.5"/>
    <circle cx="100" cy="138" r="3.5" fill="#6b3f1d"/>
    <!-- Ecken-Beschläge -->
    <rect x="35" y="118" width="14" height="55" fill="#e8c766" opacity="0.85" stroke="#8a6a1f" stroke-width="1.5"/>
    <rect x="151" y="118" width="14" height="55" fill="#e8c766" opacity="0.85" stroke="#8a6a1f" stroke-width="1.5"/>
  </g>
</svg>
