<div class="container mt-4" style="max-width: 500px;">
    <h2> {{ istBearbeitung ? 'Wunsch bearbeiten' : 'Neuer Wunsch'}}</h2>
    <form (ngSubmit)="speichern()">
        <div class="mb-3">
            <label class="form-label">Titel</label>
            <input type="text" class="form-control" [(ngModel)]="wunsch.titel" name="titel" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Kategorie</label>
            <input type="text" class="form-control" [(ngModel)]="wunsch.kategorie" name="kategorie"
                   placeholder="z.B. Elektronik, Bücher, Sonstiges,...">
        </div>

        <div class="mb-3">
            <label class="form-label">Preis (€)</label>
            <input type="text" class="form-control" [(ngModel)]="wunsch.preis" name="preis">
        </div>

        <div class="mb-3">
            <label class="form-label">Link zum Angebot</label>
            <input type="url" class="form-control" [(ngModel)]="wunsch.link" name="link"
                   placeholder="https://...">
        </div>

        <div class="mb-3">
            <label class="form-label">Bild Upload</label>
            <input type="file" class="form-control" accept="image/*" (change)="onBildAusgewaehlt($event)">
        </div>

        <div class="mb-3">
            <label class="form-label">Notiz</label>
            <textarea class="form-control" [(ngModel)]="wunsch.notiz" name="notiz" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Speichern</button>
        <a routerLink="/wuensche" class="btn btn-outline-secondary">Abbrechen</a>
    </form>
</div>
