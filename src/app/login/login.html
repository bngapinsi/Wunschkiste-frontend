
 <h2 class="login-title">
        Willkommen<br>
        zu deiner Wunschkiste
    </h2>
<div class="container mt-0" style="max-width: 400px;">

   

<div class="login-card">
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link" [class.active]="modus === 'anmelden'"
               (click)="modusWechseln('anmelden')" style="cursor: pointer;">Anmelden</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" [class.active]="modus === 'registrieren'"
               (click)="modusWechseln('registrieren')" style="cursor: pointer;">Registrieren</a>
        </li>
    </ul>

    <div *ngIf="fehlerText" class="alert alert-danger"> {{ fehlerText }}</div>

    <form *ngIf="modus === 'anmelden' " (ngSubmit)="anmelden()">
        <div class="mb-3">
           <label class="form-label">Benutzername</label> 
           <input type="text" class="form-control" [(ngModel)]="benutzername" name="benutzername" required>
        </div>
        <div class="mb-3">
           <label class="form-label">Passwort</label>
           <div class="input-group">
            <input [type]="passwortSichtbar ? 'text' : 'password' " class="form-control" [(ngModel)]="passwort" name="passwort" required>
            <button type= "button" class="btn btn-outline-secondary" (click)="togglePasswortSichtbar()">
                <i class="bi" [class.bi-eye]="passwortSichtbar" [class.bi-eye-slash]="!passwortSichtbar"></i>
            </button>
           </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="!validAnmelden()">Anmelden</button>
    </form>

    <form *ngIf="modus === 'registrieren' " (ngSubmit)="registrieren()">
        <div class="mb-3">
            <label class="form-label">Vorname</label>
            <input type="text" class="form-control" [(ngModel)]="vorname" name="vorname" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nachname</label>
            <input type="text" class="form-control" [(ngModel)]="nachname" name="nachname" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Benutzername</label>
            <input type="text" class="form-control" [(ngModel)]="neuerBenutzername" name="neuerBenutzername" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Passwort</label>
            <div class="input-group">
                <input [type]="neuesPasswortSichtbar ? 'text' : 'password' " class="form-control" [(ngModel)]="neuesPasswort" name="neuesPasswort" required>
                <button type="button" class="btn btn-outline-secondary" (click)="toggleNeuesPasswort()">
                    <i class="bi" [class.bi-eye]="neuesPasswortSichtbar"[class.bi-eye-slash]="!neuesPasswortSichtbar" ></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="!validRegistrieren()">Registrieren</button>
    </form>
    </div>

</div>
<app-confirm [headline]="dialogHeadline" [info]="dialogInfo" [sichtbar]="dialogSichtbar" (ok)="closeDialog()"> </app-confirm>
