<div class="container-fluid" >
 <div class="d-flex justify-content-between align-items-center mb-3">
    <!-- der Vorname aus dem Auth-Service, gefolgt von "s Wunschkiste" -->
    <h1>{{ name() }}s Wunschkiste</h1>
     <div class="mb-2">
   <input type="text" class="form-control" placeholder="Wunsch suchen..."
            [(ngModel)]="suchbegriff">
 </div>
    <button class="btn btn-outline-secondary" (click)="logout()">Logout</button>
 </div>


 <a routerLink="/neu" class="wunsch-button btn btn-primary position-fixed bottom-0 end-0 m-5" style="z-index: 1030;">+ Neuer Wunsch</a>

 <nav class="navbar navbar-expand-lg sticky-top navbar-light bg-transprent py-3 px-4">
 <ul class="nav nav-pills mb-3">
   <li class="nav-item" *ngFor="let kat of kategorie">
      <a class="nav-link" style="cursor: pointer;"
         [class.active]="ausgewaehlteKategorie === kat"
         (click)="kategorieWaehlen(kat)">{{ kat }}</a>
   </li>
 </ul>
 </nav>


<div class="row">
 
<div class="col-6 col-md-3 mb-4" *ngFor="let wunsch of gefilterteWuensche">
  <div class="card wunsch-card" >

   <div class="d-flex justify-content-center">
    <img *ngIf="wunsch.bildUrl" [src]="bildUrl(wunsch.bildUrl)" class="wunsch-bild" alt="Wunschbild">
    <div *ngIf="!wunsch.bildUrl" class="wunsch-bild bg-light"></div>
    </div>

    <h5 class="card-title px-2 pt-2 mb-0">{{ wunsch.titel }}</h5>

    <h6 class="card-subtitle px-2 text-body-secondary mb-0">{{ wunsch.kategorie }} · {{ wunsch.preis }} €</h6>

    <div class="px-2">
      <p *ngIf="wunsch.notiz" class="wunsch-notiz mb-0">{{ wunsch.notiz }}</p>
      <a *ngIf="wunsch.link" [href]="wunsch.link" class="card-link">Link</a>
    </div>

    <div class="wunsch-actions px-2">
      <a [routerLink]="['/bearbeiten', wunsch.id]" class="btn btn-sm btn-outline-secondary">Bearbeiten</a>
      <button (click)="loeschen(wunsch.id!)" class="btn btn-sm btn-outline-danger">Löschen</button>
    </div>

  </div>
  </div>
</div>
   
  <p *ngIf="gefilterteWuensche.length === 0">Noch keine Wünsche vorhanden.</p>
</div>
