<div class="modal d-block" tabindex="-1" *ngIf="sichtbar" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ headline }}</h5>
      </div>
      <div class="modal-body">
        <p>{{ info }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="schliessen()">Ok</button>
      </div>
    </div>
  </div>
</div>
